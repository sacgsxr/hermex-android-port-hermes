name: Android CI

on:
  pull_request:
    paths:
      - android/**
      - ci/endpoint_parity.py
      - ci/generate_android_localization_catalog.py
      - ci/migrate_android_compose_literals.py
      - ci/android_localization_aliases.json
      - ci/android_supplemental_localizations.json
      - HermesMobile/Networking/Endpoints.swift
      - HermesMobile/Resources/Localizable.xcstrings
      - .github/workflows/android-ci.yml
  push:
    branches:
      - master
    paths:
      - android/**
      - ci/endpoint_parity.py
      - ci/generate_android_localization_catalog.py
      - ci/migrate_android_compose_literals.py
      - ci/android_localization_aliases.json
      - ci/android_supplemental_localizations.json
      - HermesMobile/Networking/Endpoints.swift
      - HermesMobile/Resources/Localizable.xcstrings
      - .github/workflows/android-ci.yml

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kotlin, Lint, And Device Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify endpoint parity
        run: python3 ci/endpoint_parity.py

      - name: Verify localization catalog parity
        run: |
          python3 ci/generate_android_localization_catalog.py --check
          python3 ci/migrate_android_compose_literals.py --check

      - name: Test, lint, and build
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Run API 27 connected-device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 27
          target: default
          arch: x86
          profile: pixel_2
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest

      - name: Run focused API 35 connected-device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class='com.uzairansar.hermex.HermexUiFlowTest#chatPendingPromptsStayBetweenTopBarAndComposer,com.uzairansar.hermex.HermexUiFlowTest#chatRouteKeepsUserPositionWhenStreamUpdatesAfterUpwardDrag'

      - name: Run focused API 36 connected-device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class='com.uzairansar.hermex.HermexUiFlowTest#chatPendingPromptsStayBetweenTopBarAndComposer,com.uzairansar.hermex.HermexUiFlowTest#chatRouteKeepsUserPositionWhenStreamUpdatesAfterUpwardDrag'
